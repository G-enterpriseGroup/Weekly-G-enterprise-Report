name: Weekly G-Enterprise Macro Report

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday at 12:00 UTC
    - cron: "0 12 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly macro report
        env:
          GHOTRA_OUTPUT_DIR: output
          PUBLISH_DIR: public
          OPEN_HTML_AFTER: "0"
          USE_LOCAL_LLM_REWRITER: "0"
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -f "scripts/weekly_macro_report.py" ]; then
            python -u scripts/weekly_macro_report.py
          elif [ -f "weekly_macro_report.py" ]; then
            python -u weekly_macro_report.py
          else
            echo "ERROR: Could not find weekly_macro_report.py"
            echo "Put your Python file at scripts/weekly_macro_report.py"
            exit 1
          fi

      - name: Show generated website files
        run: |
          echo "Public files:"
          find public -maxdepth 4 -type f | sort || echo "No public folder found"

          echo ""
          echo "Chart files:"
          find public/charts -type f | sort || echo "No public/charts folder found"

          echo ""
          echo "Index chart references:"
          grep -o 'charts/[^"]*\.png' public/index.html || echo "No chart image links found in index.html"

      - name: Verify public folder
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "ERROR: public/index.html was not created."
            echo "Your Python script must copy the final report to public/index.html"
            exit 1
          fi

          if [ ! -d "public/charts" ]; then
            echo "WARNING: public/charts folder was not created."
            echo "The report may still publish, but charts may be missing."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
