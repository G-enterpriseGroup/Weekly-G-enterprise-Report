      - name: Show generated website files
        run: |
          echo "Public files:"
          find public -maxdepth 4 -type f | sort || echo "No public folder found"

          echo ""
          echo "Chart files:"
          find public/charts -type f | sort || echo "No public/charts folder found"

          echo ""
          echo "Index chart references:"
          grep -o 'charts/[^"]*\.png' public/index.html || echo "No chart image links found in index.html"
